<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bortakväll 🍬</title>
  </head>
  <body>
    <!-- Kundvagn -->
    <div class="cart-overlay w-100 h-100 modal-backdrop invisible">
      <div class="cart-section text-center p-2">
        <div class="cart-header-section d-flex justify-content-between">
          <p class="invisible">x</p>
          <h2 class="cart-header">Kundvagn</h2>
          <p class="cart-close-button pe-2">x</p>
        </div>
        <div class="cart-product-section">
          <div class="row pb-2 pt-2">
            <img
              src="src/assets/images/thumnail-test.png"
              class="cart-product-img img-thumbnail col-3 ms-3"
            />
            <h3 class="cart-product-header text-start col-4 d-flex flex-column">
              Lakrits skallar
              <span class="cart-product-trashcan mt-auto">- HG +</span>
            </h3>
            <h4
              class="cart-product-price col-3 d-flex flex-column align-items-end"
            >
              123kr
              <span class="cart-product-trashcan mt-auto">🗑️</span>
            </h4>
          </div>
        </div>
        <div class="d-flex justify-content-between p-2">
          <p>Totalt:</p>
          <p>123kr</p>
        </div>
      </div>
    </div>
    <div class="container">
      <header>
        <div
          class="d-flex p-3 align-items-center justify-content-between border-bottom"
        >
          <i class="fa-solid fa-arrow-left-long invisible"></i>

          <h1>
            <a href="/" class="d-flex justify-content-center">
              <img src="src/assets/images/bortakvall-logo.png" class="w-50" />
            </a>
          </h1>
          <i class="fa-solid fa-cart-shopping fs-4"></i>
        </div>
      </header>
      <button class="goToPage">Product-page</button>
      <button class="goToPage2">Checkout-page</button>
      <button class="goToPage3">Order complete</button>
      <main class="productPageMain"></main>
      <footer
        class="d-flex justify-content-between align-items-center py-3 border-top mt-3"
      >
        <span class="text-muted ms-2">© 2025 Bortakväll</span>

        <ul class="nav d-flex me-2">
          <li class="ms-3">
            <a class="text-muted" href="#"
              ><i class="fa-brands fa-instagram fs-5"></i
            ></a>
          </li>
          <li class="ms-3">
            <a class="text-muted" href="#"
              ><i class="fa-brands fa-facebook fs-5"></i
            ></a>
          </li>
        </ul>
      </footer>
      <script type="module" src="/src/main.ts"></script>
    </div>
  </body>
</html>
