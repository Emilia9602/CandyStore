<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout-page</title>
  </head>
  <body>
    <div class="container">
      <header class="mx-auto">
        <div
          class="d-flex p-3 justify-content-between align-items-center border-bottom"
        >
          <i class="fa-solid fa-arrow-left-long fs-5"></i>

          <h1>
            <a href="/" class="d-flex justify-content-center">
              <img src="../images/bortakvall-logo.png" class="w-50" />
            </a>
          </h1>
          <i class="fa-solid fa-cart-shopping fs-4 invisible"></i>
        </div>
      </header>

      <div class="row justify-content-center m-5">
        <div class="col-md-4 border rounded">
          <p>Box där varukorgen ska visas</p>
        </div>
      </div>
      <div class="row justify-content-center m-5">
        <form class="col-md-4">
          <label for="name" class="form-label mt-2 ms-1">Namn</label>
          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="Namn"
            required
          />

          <label for="adress" class="form-label mt-2 ms-1">Adress</label>
          <input
            type="text"
            id="adress"
            class="form-control"
            placeholder="Adress"
            required
          />

          <label for="postNum" class="form-label mt-2 ms-1">Postnummer</label>
          <input
            type="text"
            id="postNum"
            class="form-control"
            placeholder="Postnummer"
            required
          />

          <label for="place" class="form-label mt-2 ms-1">Ort</label>
          <input
            type="text"
            id="place"
            class="form-control"
            placeholder="Ort"
            required
          />

          <label for="phone" class="form-label mt-2 ms-1">Telefonnummer</label>
          <input
            type="tel"
            id="phone"
            class="form-control"
            placeholder="070 123 45 67"
          />

          <label for="email" class="form-label mt-2 ms-1">E-post</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="E-post"
            required
          />

          <div class="text-center">
            <button
              id="submitBtn"
              type="submit"
              class="btn btn-dark fw-bold mt-3"
            >
              Bekräfta
            </button>
          </div>
        </form>
      </div>

      <footer
        class="d-flex justify-content-between align-items-center py-3 border-top mt-3"
      >
        <span class="text-muted ms-2">© 2025 Bortakväll</span>

        <ul class="nav d-flex me-2">
          <li class="ms-3">
            <a class="text-muted" href="#"
              ><i class="fa-brands fa-instagram fs-5"></i
            ></a>
          </li>
          <li class="ms-3">
            <a class="text-muted" href="#"
              ><i class="fa-brands fa-facebook fs-5"></i
            ></a>
          </li>
        </ul>
      </footer>
    </div>
    <script type="module" src="../ts/checkout-page.ts"></script>
  </body>
</html>
