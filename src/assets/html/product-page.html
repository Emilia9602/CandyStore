<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
          <text y='.9em' font-size='90'>🍬</text>
        </svg>"
    />
    <link href="../css/product-page.css" rel="stylesheet" />
    <title>Bortakväll</title>
  </head>

  <body>
    <!-- Kundvagn -->
    <div class="cart-overlay w-100 h-100 modal-backdrop invisible">
      <div class="cart-section text-center p-2">
        <div class="cart-header-section d-flex justify-content-between">
          <p class="invisible">x</p>
          <img
            src="../images/kundvagn-header.png"
            alt="kundvagn-header"
            class="cart-header-img"
          />
          <p class="cart-close-button pe-2">x</p>
        </div>
        <div class="cart-product-section"></div>
        <div class="botton-cart-container">
          <div class="d-flex justify-content-between align-items-center p-2">
            <p>Totalt:</p>
            <p class="total-price fs-5">0kr</p>
          </div>
          <div
            class="checkout-button-section d-flex justify-content-center mt-auto"
          >
            <button
              class="cart-checkout-button btn-light btn p-4 pt-2 pb-2 mb-3"
            >
              Till Kassan
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <header>
        <div
          class="d-flex p-3 justify-content-between align-items-center border-bottom"
        >
          <i class="fa-solid fa-arrow-left-long fs-5"></i>

          <h1>
            <a href="/" class="d-flex justify-content-center">
              <img src="../images/bortakvall-logo.png" class="w-75" />
            </a>
          </h1>
          <div class="cart-icon cartHover">
            <i class="fa-solid fa-cart-shopping fs-4"></i>
            <span class="cart-count">0</span>
          </div>
        </div>
      </header>
    </div>
    <div class="product-banner text-center">
      <h4 class="product-banner-text fs-6 p-2">
        1-4 dagars leverans | Fri frakt | Säkra betalningar
      </h4>
    </div>
    <div class="container">
      <main class="oneProductMain"></main>

      <footer
        class="d-flex justify-content-between align-items-center py-3 border-top mt-3"
      >
        <span class="text-muted ms-2">© 2025 Bortakväll</span>

        <ul class="nav d-flex me-2">
          <li class="ms-3">
            <a class="text-muted" href="#"
              ><i class="fa-brands fa-instagram fs-5"></i
            ></a>
          </li>
          <li class="ms-3">
            <a class="text-muted" href="#"
              ><i class="fa-brands fa-facebook fs-5"></i
            ></a>
          </li>
        </ul>
      </footer>
    </div>
    <script type="module" src="../ts/product-page.ts"></script>
  </body>
</html>
