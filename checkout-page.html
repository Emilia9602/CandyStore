<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
          <text y='.9em' font-size='90'>🍬</text>
        </svg>" />
  <title>Bortakväll</title>
</head>

<body>

  <!-- Header -->

  <div class="container">
    <header class="mx-auto">
      <div class="d-flex p-3 justify-content-between align-items-center">
        <i class="fa-solid fa-arrow-left-long fs-5 arrowLeft"></i>

        <h1>
          <a href="/" class="d-flex justify-content-center">
            <img src="src/assets/images/bortakvall-logo.png" class="w-75" />
          </a>
        </h1>
        <i class="fa-solid fa-cart-shopping fs-4 invisible"></i>
      </div>
    </header>

    <!-- Order and checkout-form -->

    <main>
      <div class="row justify-content-center gap-4 mx-1 mt-3">
        <div class="col-12 col-xl-6 rounded-3 checkoutDiv mb-4 d-flex flex-column px-3">
          <h4 class="pt-3 px-2 fs-2 text-center">Din beställning:</h4>
          <hr />
          <div id="checkoutCartList" class="flex-grow-1 product-checkout-section justify-content-end pe-3"></div>
          <div class="checkoutTotal"></div>
        </div>
        <div class="col-12 col-xl-6 checkout-form-container mb-4 rounded-3 px-3">
          <h4 class="text-center fs-2 pt-3">Kontakt:</h4>
          <hr />
          <form class="checkoutForm m-auto">
            <label for="name" class="form-label mt-2 fs-5">Namn:</label>
            <input type="text" id="name" class="form-control checkoutInput" placeholder="Namn" required />

            <label for="surname" class="form-label mt-2 fs-5">Efternamn:</label>
            <input type="text" id="surname" class="form-control checkoutInput" placeholder="Efternamn" required />

            <label for="adress" class="form-label mt-2 fs-5">Adress:</label>
            <input type="text" id="adress" class="form-control checkoutInput" placeholder="Adress" required />

            <label for="postNum" class="form-label mt-2 fs-5">Postnummer:</label>
            <input type="text" id="postNum" class="form-control checkoutInput" placeholder="Postnummer" required />

            <label for="place" class="form-label mt-2 fs-5">Ort:</label>
            <input type="text" id="place" class="form-control checkoutInput" placeholder="Ort" required />

            <label for="phone" class="form-label mt-2 fs-5">Telefonnummer:</label>
            <input type="tel" id="phone" class="form-control checkoutInput" placeholder="070 123 45 67" />

            <label for="email" class="form-label mt-2 fs-5">E-post:</label>
            <input type="email" id="email" class="form-control checkoutInput" placeholder="E-post" required />

            <div class="text-center">
              <button id="submitBtn" type="submit" class="btn btn-light mt-3 fs-5 mb-3">
                Fortsätt
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Footer -->

    <footer class="d-flex justify-content-between align-items-center py-3 border-top mt-3 mt">
      <span class="text-muted ms-2">© 2025 Bortakväll</span>

      <ul class="nav d-flex me-2">
        <li class="ms-3">
          <a class="text-muted" href="#"><i class="fa-brands fa-instagram fs-5"></i></a>
        </li>
        <li class="ms-3">
          <a class="text-muted" href="#"><i class="fa-brands fa-facebook fs-5"></i></a>
        </li>
      </ul>
    </footer>
  </div>
  <script type="module" src="/src/assets/ts/checkout-page.ts"></script>
</body>

</html>
